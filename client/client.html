<!DOCTYPE html>

<head>

  <script>
    // use this for response box setting, handling post/get/head
    const handleResponse = async (response, parseJSON) => {
      const content = document.querySelector('#content');

      // switch (response.status) {
      //   case 200:
      //     content.innerHTML = '<b>Success</b>';
      //     break;
      //   case 201:
      //     content.innerHTML = '<b>Created</b>';
      //     break;
      //   case 204:
      //     content.innerHTML = '<b>Updated (No Content)</b>';
      //     return;
      //   case 400:
      //     content.innerHTML = '<b>Bad Request</b>';
      //     break;
      //   case 404:
      //     content.innerHTML = '<b>Not Found</b>';
      //     break;
      //   default:
      //     content.innerHTML = 'Error code not implemented by client.';
      //     break;
      // }


      // manage head/get, post here - not so sure about that anymore
      // display your results here - set result.innerHTML


      // HEAD responses have no body, so don't try to parse them.
      if (!parseJSON) return;

      const obj = await response.json();
      console.log(obj);

      if (obj.message) {
        content.innerHTML += `<p>Message: ${obj.message}</p>`;
      } else if (obj.users) {
        content.innerHTML += `<p>${JSON.stringify(obj.users)}</p>`;
      }
    };

    // POST from the "Add User" form
    const sendPost = async (nameForm) => {
      const url = nameForm.getAttribute('action');
      const method = nameForm.getAttribute('method'); // PIN this is setting the METHOD!

      const name = nameForm.querySelector('#nameField').value;
      const age = nameForm.querySelector('#ageField').value;

      const formData = `name=${encodeURIComponent(name)}&age=${encodeURIComponent(age)}`;

      const response = await fetch(url, {
        method,
        headers: {
          'Content-Type': 'application/x-www-form-urlencoded',
          Accept: 'application/json',
        },
        body: formData,
      });

      handleResponse(response, true);
    };

    // GET/HEAD from the "Get User" form
    const requestUpdate = async (userForm) => {
      const url = userForm.querySelector('#urlField').value;
      const method = userForm.querySelector('#methodSelect').value.toUpperCase();
      // make method a GET HEAD radio select

      const response = await fetch(url, {
        method,
        headers: { Accept: 'application/json' },
      });

      handleResponse(response, method !== 'HEAD');

      // btw try and send these using request.query instead of request.body - is that possible? how do I handle .body?
    };

    // adds event listeners to buttons
    // prevents default behavior using .preventDefault()
    const init = () => {
      const nameForm = document.querySelector('#nameForm');
      const userForm = document.querySelector('#userForm');

      nameForm.addEventListener('submit', (e) => {
        e.preventDefault();
        sendPost(nameForm);
        return false;
      });

      userForm.addEventListener('submit', (e) => {
        e.preventDefault();
        requestUpdate(userForm);
        return false;
      });
    };

    // window.onload = init;
  </script>
