  <script>
    // use this for response box setting, handling post/get/head
    const handleResponse = async (response, parseJSON, form) => {
      // const content = form.querySelector('#result'); // set .value
      const content = form.querySelector('#result'); // set .innerHTML
      const method = form.getAttribute('method');

      console.log(content);
      console.log(method.toUpperCase());

      const obj = await response.json();
      console.log(obj);
      console.log(obj.message);


      switch (method.toUpperCase()) {
        case 'GET' || 'POST':
          content.innerHTML =
            `Status: ${obj.status}<br>
          Content-Length: ${obj.contentLength}<br>
          Message: ${JSON.stringify(obj.message)}`;
          break;
        case 'HEAD':
          content.innerHTML = `Status: ${obj.status}`;
          break;
        default:
          content.innerHTML = 'Error. Code: 501 (not implemented) id: handleResponseDefault';
      }

      /* -------- Old Stuff -----------------
      
      // manage head/get, post here - not so sure about that anymore
      // display your results here - set result.innerHTML
      
      // response.method === 'GET'
      
      
      
      
      // HEAD responses have no body, so don't try to parse them.
      if (!parseJSON) return;
      
      const obj = await response.json();
      console.log(obj);
      
      if (obj.message) {
        content.innerHTML += `<p>Message: ${obj.message}</p>`;
      } else if (obj.users) {
        content.innerHTML += `<p>${JSON.stringify(obj.users)}</p>`;
      }
      */
    };

    // ------------ POST requests --------------------------------------
    const postHandler = async (form) => {
      console.log('sending post');

      const url = form.getAttribute('action');

      // const name = nameForm.querySelector('#nameField').value;
      // const age = nameForm.querySelector('#ageField').value;

      // const formData = `name=${encodeURIComponent(name)}&age=${encodeURIComponent(age)}`;
      const test = `test`;

      const response = await fetch(url, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/x-www-form-urlencoded',
          Accept: 'application/json',
        },
        body: test,
      });

      handleResponse(response, true);
    };

    
    // ------------- GET/HEAD requests -------------------------------
    const getHandler = async (form) => {
      console.log('retrieving get');

      // winning url:
      const url = form.getAttribute('action'); // form.action is the whole url incl local address
      // winning method:
      const method = form.querySelector('#methodSelect').value.toUpperCase();

      // test URL
      const response = await fetch(url, {
        method,
        headers: { Accept: 'application/json' },
      });

      handleResponse(response, method !== 'HEAD', form); // passes t/f of conditional as boolean param parseJSON
    };


    const findMethod = (form) => {
      const method = form.getAttribute('method');

      // pass the whole thing to the right handler
      if(form.method.toUpperCase() === 'GET'){
        getHandler(form);
      } else {
        postHandler(form);
      }
    };



    // adds same event listener to all FORMS, not buttons
    // prevents 'submit' default behavior using .preventDefault()
    const init = () => {      
      const forms = document.querySelectorAll('form');
      // console.log("forms found:", forms, forms[0].id);

      forms.forEach((form) => {
        form.addEventListener('submit', (e) => {
          e.preventDefault(); // if using 'submit'
          findMethod(e.target);
        });
      });
    };

    window.onload = init;
  </script>
</head>

  <section id="top">

        </select>
        <button type="submit">Go</button><br>
        <!-- div as a readonly output text box, with some semantic html explanation for screen readers -->
        <div id="result" aria-disabled="true" role="textbox"></div>
      </form>
      <h3>/searchSinglePokemon</h3>

        <input type="text" id="nameBox"/>
        <button type="submit">Go</button><br>
        <div id="result" aria-disabled="true" role="textbox"></div>
      </form>
    </section>
