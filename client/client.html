<head>
  <title>The Pokebrowser</title>

  <!-- <script src="client.js"> -->
  <script>
    // use this for response box setting, handling post/get/head
    const handleResponse = async (response, parseJSON, form) => {
      // const content = form.querySelector('#result'); // set .value
      const content = form.querySelector('#result'); // set .innerHTML
      const method = form.getAttribute('method');

      // console.log("outputting to content", content);
      console.log(method.toUpperCase());

      // update the first part of our response no matter what
      content.innerHTML = `Status: ${response.status}`;

      // HEAD responses have no body, so don't try to parse them.
      if (!parseJSON) return;
      
      // now safe to parse
      const obj = await response.json(); // this parses!
      console.log(obj);

      switch (method.toUpperCase()) {
        // this is apparently how to do 'GET' || 'POST' with a switch case
        case 'GET':
        case 'POST':
          content.innerHTML +=
            `<br>${JSON.stringify(obj)}`;  // stretch: filter out ", join with ,+" "
            // stretch - remove status at beginning - rest/destructuring?
            // regex formatting - capitalize first char, space after every :, <br> at end of every line (obj attr)
          break;
        default:
          content.innerHTML = 'Error. Code: 501 (not implemented) id: handleResponseDefault';
          break;
      }
    };

    // ------------ POST requests --------------------------------------
    const postHandler = async (form) => {
      console.log('sending post');
      const url = form.getAttribute('action'); // /endpoint
            
      // send as body, or should I encode?
      // - if we set "C-Type" to "form encoded", we better encode it
      const name = form.querySelector('#nameBox').value;
      const id = form.querySelector('#idBox').value;
      const type = form.querySelector('#typeBox').value;
      const weakness = form.querySelector('#weaknessBox').value;
      const height = form.querySelector('#heightBox').value;
      const weight = form.querySelector('#weightBox').value;

      let formData = `name=${encodeURIComponent(name)}&id=${encodeURIComponent(id)}&type=${encodeURIComponent(type)}&weakness=${encodeURIComponent(weakness)}&height=${encodeURIComponent(height)}&weight=${encodeURIComponent(weight)}`;

      // if there's a new name box
      if(form.querySelector('#newNameBox')) {
        // add the data to formData
        formData += `&newName=${encodeURIComponent(form.querySelector('#newNameBox').value)}`;
      }

      const response = await fetch(url, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/x-www-form-urlencoded',
          Accept: 'application/json',
        },
        body: formData,
      });

      handleResponse(response, true, form);
    };

    
    // ------------- GET/HEAD requests -------------------------------
    const getHandler = async (form) => {
      const action = form.getAttribute('action'); // is /endpoint
      const method = form.querySelector('#methodSelect').value.toUpperCase();
      let response;
      console.log('retrieving', method);
      
      // if we have input boxes
      // add them to url query params
      // - handle bad inputs in jsonResponses
      if(form.querySelector('#nameBox')) {
        console.log("name box recognized", form.querySelector('#nameBox'));
        const name = form.querySelector('#nameBox').value;
        const url = `${action}?name=${encodeURIComponent(name)}`;

        console.log("url", url);

        response = await fetch(url, {
          method,
          headers: { Accept: 'application/json' },
        });
        // if we have a type and a weakness box
      } else if(form.querySelector('#typeBox') && form.querySelector('#weaknessBox')){
        console.log("CACKAAAAWWW");
        console.log("type", form.querySelector('#typeBox').value);
        console.log("weakness", form.querySelector('#weaknessBox').value);

        const type = form.querySelector('#typeBox').value;
        const weakness = form.querySelector('#weaknessBox').value;
        const url = `${action}?type=${encodeURIComponent(type)}&weakness=${encodeURIComponent(weakness)}`;
        // handle cases here potentially (if no type, etc) - Sam did in JSONresponses

        console.log("url", url);

        response = await fetch(url, {
          method,
          headers: { Accept: 'application/json' },
        });

      } else {
        //fetch with no inputs
        console.log("NO INPUTS RECEIVED");
        console.log("action", action, "method", method);

        response = await fetch(action, {
          method,
          headers: { Accept: 'application/json' },
        });
      }

      handleResponse(response, method !== 'HEAD', form); // passes t/f of conditional as boolean param parseJSON
    };


    const findMethod = (form) => {
      const method = form.getAttribute('method');

      // pass the whole thing to the right handler
      if(form.method.toUpperCase() === 'GET'){
        getHandler(form);
      } else {
        postHandler(form);
      }
    };


    // adds same event listener to all FORMS, not buttons
    // prevents 'submit' default behavior using .preventDefault()
    const init = () => {      
      const forms = document.querySelectorAll('form');
      // console.log("forms found:", forms, forms[0].id);

      forms.forEach((form) => {
        form.addEventListener('submit', (e) => {
          e.preventDefault(); // if using 'submit'
          findMethod(e.target);
        });
      });
    };

    window.onload = init;
  </script>
</head>
